name: Build TWRP (android-8.1) j2corelte

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick lib32ncurses5-dev lib32readline6-dev lib32z1-dev \
            libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush \
            rsync schedtool squashfs-tools xsltproc zip zlib1g-dev openjdk-8-jdk repo \
            libtinfo5 libncurses5 python2
          sudo ln -sf /usr/bin/python2 /usr/bin/python
          python --version

      - name: Install repo
        run: |
          sudo apt-get install -y python3 python3-pip
          mkdir -p $HOME/bin
          curl -sSL https://storage.googleapis.com/git-repo-downloads/repo -o $HOME/bin/repo
          chmod +x $HOME/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH
          $HOME/bin/repo --version

      - name: Init repo (local omni-twrp-9.0 manifest)
        run: |
          set -x
          git config --global user.email "build@example.com"
          git config --global user.name "build"
          git config --global color.ui false
          mkdir -p twrp && cd twrp
          repo init -u https://github.com/lehoangpro0815-droid/twrp -b main -m default.xml -g all --depth=1
          repo sync -j4 --force-sync --no-clone-bundle

      - name: Add device tree (j2corelte 8.1)
        run: |
          cd twrp
          mkdir -p device/samsung
          cp -r ../android_device_samsung_j2corelte-android-8.1 device/samsung/j2corelte
          ls device/samsung/j2corelte

      - name: Build recovery
        run: |
          set -x
          cd twrp
          mkdir -p kernel/samsung
          git clone --depth=1 https://github.com/VladAndroidGamer/android_kernel_samsung_j2corelte -b master kernel/samsung/j2corelte
          . build/envsetup.sh
          rm -rf bootable/recovery/tests
          lunch omni_j2corelte-eng
          make recoveryimage -j$(nproc)

      - name: Upload recovery.img
        uses: actions/upload-artifact@v4
        with:
          name: twrp-j2corelte-8.1
          path: twrp/out/target/product/j2corelte/recovery.img
