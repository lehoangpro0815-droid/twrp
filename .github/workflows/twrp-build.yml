name: Build TWRP (android-8.1) j2corelte

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick lib32ncurses5-dev lib32readline6-dev lib32z1-dev \
            libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush \
            rsync schedtool squashfs-tools xsltproc zip zlib1g-dev openjdk-8-jdk repo

      - name: Init repo (TWRP 8.1 = 3.3.x)
        run: |
          mkdir -p twrp && cd twrp
          repo init -u https://github.com/TeamWin/android_manifest.git -b twrp-8.1 --depth=1
          repo sync -j4 --force-sync --no-clone-bundle

      - name: Add device tree (j2corelte 8.1)
        run: |
          cd twrp
          # copy your local android-8.1 device tree here (push it into this repo under device/samsung/j2corelte)
          cp -r ../android_device_samsung_j2corelte-android-8.1 device/samsung/j2corelte 2>/dev/null || \
            git clone https://github.com/<your-user>/android_device_samsung_j2corelte -b twrp-8.1 device/samsung/j2corelte

      - name: Build recovery
        run: |
          cd twrp
          . build/envsetup.sh
          lunch omni_j2corelte-eng
          make recoveryimage -j$(nproc)

      - name: Upload recovery.img
        uses: actions/upload-artifact@v4
        with:
          name: twrp-j2corelte-8.1
          path: twrp/out/target/product/j2corelte/recovery.img
